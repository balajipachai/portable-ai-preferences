<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portable AI Preferences</title>
<style>
  :root { --bg:#fafaf7; --fg:#1c1c1a; --muted:#6b6b66; --card:#fff; --line:#deded8; --accent:#2f5d50; --warn:#9a5b00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161715; --fg:#ececE6; --muted:#9a9a93; --card:#1f201e; --line:#34352f; --accent:#7fc4ae; --warn:#e0a458; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.6 system-ui, sans-serif; }
  main { max-width:680px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  label { display:block; font-weight:600; margin:16px 0 6px; }
  input, textarea { width:100%; padding:10px 12px; font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  button { margin-top:16px; padding:10px 18px; font:inherit; font-weight:600; background:var(--accent); color:var(--bg); border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .card { margin-top:24px; padding:16px; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .card h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; }
  .answer { white-space:pre-wrap; }
  .chips span { display:inline-block; margin:0 6px 6px 0; padding:2px 10px; border:1px solid var(--line); border-radius:999px; font-size:.85rem; }
  .note { color:var(--warn); font-size:.9rem; }
  .err { color:#c0392b; }
</style>
</head>
<body>
<main>
  <h1>Stop making me explain myself</h1>
  <p class="sub">Enter your ENS name once. Answers follow the preferences stored in its <code>ai.preferences</code> text record.</p>

  <label for="name">Your ENS name (Sepolia)</label>
  <input id="name" placeholder="ana.eth" autocomplete="off" spellcheck="false">

  <label for="q">Ask anything</label>
  <textarea id="q" rows="3" maxlength="2000" placeholder="What is a blockchain?"></textarea>

  <button id="go">Ask</button>

  <div id="out"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const out = $("out");

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  for (const k of kids) e.append(k);
  return e;
}

function card(title, ...kids) {
  return el("div", { class: "card" }, el("h2", {}, title), ...kids);
}

const SOURCE_TEXT = {
  record: "Preferences read from your ENS record.",
  "default-unset": "No preferences found on this name — using defaults.",
  "default-invalid": "The record could not be used — using defaults.",
};

$("go").addEventListener("click", async () => {
  const btn = $("go");
  btn.disabled = true;
  out.replaceChildren(el("p", { class: "sub" }, "Thinking…"));
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ name: $("name").value, question: $("q").value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Request failed.");

    const chips = el("div", { class: "chips" });
    for (const [k, v] of Object.entries(data.preferences)) chips.append(el("span", {}, `${k}: ${v}`));
    const notes = [el("div", {}, SOURCE_TEXT[data.source])];
    if (data.ignored.length) {
      notes.push(el("div", { class: "note" }, `Ignored invalid values for: ${data.ignored.join(", ")}.`));
    }
    out.replaceChildren(
      card("Answer", el("div", { class: "answer" }, data.answer)),
      card(`Preferences applied for ${data.ensName}`, chips, ...notes),
    );
  } catch (e) {
    out.replaceChildren(el("p", { class: "err" }, e.message));
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
